<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reel UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation -->
    <header class="top-bar">
        <h2>Reels</h2>
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828778.png" class="camera-icon" alt="camera">
    </header>

    <!-- REEL SECTION -->
    <div class="reel-container">
        
        <!-- Video -->
        <video class="reel-video" autoplay muted loop>
            <source src="your-video.mp4" type="video/mp4">
        </video>

        <!-- Right Action Buttons -->
        <div class="actions">
            <div class="action-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png">
                <span>1.2K</span>
            </div>
            <div class="action-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png">
                <span>230</span>
            </div>
            <div class="action-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/2089/2089158.png">
                <span>87</span>
            </div>
            <div class="action-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25663.png">
            </div>
        </div>

        <!-- Bottom Caption -->
        <div class="caption-box">
            <div class="user-info">
                <img src="https://i.pravatar.cc/100" class="avatar">
                <span class="username">username_here</span>
                <button class="follow-btn">Follow</button>
            </div>

            <p class="caption">
                This is a sample caption just like an Instagram reel caption area.
                <span>#reels #demoUI</span>
            </p>

            <div class="music-bar">
                <img src="https://cdn-icons-png.flaticon.com/512/727/727218.png">
                <span>Original audio • User123</span>
            </div>

        </div>

    </div>

</body>
</html>
